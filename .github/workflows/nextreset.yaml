name: Build and Reset on Failure

on:
  push:
    branches:
      - next-js-js-01

jobs:
  build-and-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build
        continue-on-error: true  # Continue the workflow even if the build fails

      - name: Check if build failed and reset branch
        if: failure()  # This step will run if the previous step fails
        run: |
          echo "Build failed. Resetting branch to previous commit."
          git reset --hard HEAD~1
          git push --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
