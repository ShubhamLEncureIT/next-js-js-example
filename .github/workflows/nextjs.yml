# Name of the workflow for display in the GitHub Actions UI
name: Next.js Workflow Config

# Events that trigger this workflow
on:
  push: # Run the workflow when code is pushed
    branches: 
      - next-js-js-01 # Trigger only for the 'next-js-js-01' branch

# Define the jobs that will run as part of the workflow
jobs:
  build: # Name of the job
    runs-on: ubuntu-latest # Specify the environment for the job (Ubuntu machine)

    # Steps that define the actions within the job
    steps:
      # Checkout code from the repository
      - name: Checkout code 
        uses: actions/checkout@v4 # Uses GitHub's official action to pull the repository code
      
      # Set up Node.js for the environment
      - name: Set up Node.js
        uses: actions/setup-node@v4 # Uses GitHub's official Node.js setup action
        with:
          node-version: '18' # Specifies the version of Node.js to install

      # Install dependencies for the Next.js project
      - name: Install dependencies
        run: npm install # Runs 'npm install' to fetch all required packages

      # Build the Next.js application
      - name: Build application
        run: npm run build # Runs the build command defined in the package.json file
        continue-on-error: true # Allow workflow to proceed even if this step fails

      # Check build status and reset branch if necessary
      - name: Reset branch on build failure
        if: failure() # Only execute this step if a previous step failed
        run: |
          echo "Build failed. Resetting branch to previous commit."
          git reset --hard HEAD~1
          git push --force

